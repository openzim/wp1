name: wp1-dev
services:
  redis:
    image: redis
    container_name: wp1bot-redis-dev${WP1_SUFFIX:-}
    ports:
      - ${WP1_REDIS_PORT:-9736}:6379
    networks:
      - wp1bot-dev
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 15s
      retries: 30

  dev-database:
    build: docker/dev-db/
    image: wp1bot-db-dev${WP1_SUFFIX:-}
    container_name: wp1bot-db-dev${WP1_SUFFIX:-}
    ports:
      - ${WP1_DB_PORT:-6300}:3306
    networks:
      - wp1bot-dev
    restart: always

  minio:
    image: minio/minio
    container_name: wp1bot-minio-dev${WP1_SUFFIX:-}
    ports:
      - '${WP1_MINIO_PORT:-9000}:9000' #api
      - '${WP1_MINIO_CONSOLE_PORT:-9001}:9001' #web console
    environment:
      - MINIO_ROOT_USER=minio_key
      - MINIO_ROOT_PASSWORD=minio_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - wp1bot-dev
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 10s
      retries: 30

  createbuckets:
    image: minio/mc
    container_name: wp1bot-minio-setup${WP1_SUFFIX:-}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - wp1bot-dev
    volumes:
      - ./docker/minio/setup-buckets.sh:/setup-buckets.sh
    entrypoint: ['/bin/sh', '/setup-buckets.sh']

  dev-workers:
    build:
      context: .
      dockerfile: docker/dev-workers/Dockerfile
    image: wp1bot-workers-dev${WP1_SUFFIX:-}
    container_name: wp1bot-workers-dev${WP1_SUFFIX:-}
    volumes:
      - ./wp1:/usr/src/app/wp1/
      - ./wp1/credentials.py.dev:/usr/src/app/wp1/credentials.py
      - ./log/:/var/log/wp1bot/
    networks:
      - wp1bot-dev
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      dev-database:
        condition: service_started
      minio:
        condition: service_started

  dev-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: wp1bot-web-dev${WP1_SUFFIX:-}
    container_name: wp1bot-web-dev${WP1_SUFFIX:-}
    environment:
      - FLASK_DEBUG=1
      - FLASK_RUN_HOST=0.0.0.0
    command: flask --app wp1.web.app run
    networks:
      wp1bot-dev:
        aliases:
          # Stable in-network hostname regardless of WP1_SUFFIX; referenced by
          # .env.docker and wp1/credentials.py.dev.
          - wp1bot-web-dev
    ports:
      - ${WP1_WEB_PORT:-5000}:5000
    volumes:
      - .:/usr/src/app
      - ./wp1/credentials.py.dev:/usr/src/app/wp1/credentials.py
    links:
      - redis
    restart: always
    depends_on:
      redis:
        condition: service_healthy

  dev-frontend:
    build:
      context: .
      dockerfile: docker/dev-frontend/Dockerfile
    image: wp1bot-frontend-dev${WP1_SUFFIX:-}
    container_name: wp1bot-frontend-dev${WP1_SUFFIX:-}
    environment:
      - VITE_API_URL=http://localhost:${WP1_WEB_PORT:-5000}/v1
    networks:
      - wp1bot-dev
    ports:
      - ${WP1_FRONTEND_PORT:-5173}:5173
    volumes:
      - ./wp1-frontend/src:/app/src
      - ./wp1-frontend/index.html:/app/index.html
      - ./wp1-frontend/vite.config.js:/app/vite.config.js
      - ./wp1-frontend/postcss.config.js:/app/postcss.config.js
      - ./wp1-frontend/tailwind.config.js:/app/tailwind.config.js
    restart: always
    depends_on:
      - dev-web

  zimfarm-db:
    image: postgres:17.3-bookworm
    container_name: zimfarm-postgresdb${WP1_SUFFIX:-}
    ports:
      - 127.0.0.1:${WP1_ZIMFARM_DB_PORT:-2345}:5432
    volumes:
      - zimfarm-data:/var/lib/postgresql/data
      - ./docker/zimfarm/postgres-initdb:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=zimfarm
      - POSTGRES_USER=zimfarm
      - POSTGRES_PASSWORD=zimpass
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-d', 'dbname=zimfarm user=zimfarm']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - wp1bot-dev
    profiles:
      - zimfarm

  zimfarm-api:
    image: ghcr.io/openzim/zimfarm-backend:latest
    pull_policy: always
    container_name: zimfarm-api${WP1_SUFFIX:-}
    ports:
      - 127.0.0.1:${WP1_ZIMFARM_API_PORT:-8004}:80
    environment:
      BINDING_HOST: 0.0.0.0
      JWT_SECRET: DH8kSxcflUVfNRdkEiJJCn2dOOKI3qfw
      POSTGRES_URI: postgresql+psycopg://zimfarm:zimpass@zimfarm-db:5432/zimfarm
      ALEMBIC_UPGRADE_HEAD_ON_START: true
      DEBUG: true
      INIT_USERNAME: admin
      INIT_PASSWORD: admin
      ALLOWED_ORIGINS: http://localhost:${WP1_ZIMFARM_UI_PORT:-8003}
      ARTIFACTS_UPLOAD_URI: s3+http://minio:9000/?keyId=minio_key&secretAccessKey=minio_secret&bucketName=org-kiwix-dev-artifacts
      LOGS_UPLOAD_URI: s3+http://minio:9000/?keyId=minio_key&secretAccessKey=minio_secret&bucketName=org-kiwix-dev-logs
      ZIM_UPLOAD_URI: s3+http://minio:9000/?keyId=minio_key&secretAccessKey=minio_secret&bucketName=org-kiwix-dev-zims
      OAUTH_JWKS_URI: https://ory.login-staging.kiwix.org/.well-known/jwks.json
      OAUTH_ISSUER: https://ory.login-staging.kiwix.org
      OAUTH_OIDC_CLIENT_ID: 38302485-7f3d-4e88-b1b3-ec02fb92ec8c
      OAUTH_OIDC_LOGIN_REQUIRE_2FA: true
      OAUTH_SESSION_AUDIENCE_ID: 309693e7-ad5e-4379-bf93-ba89314230fd
      OAUTH_SESSION_LOGIN_REQUIRE_2FA: true
      CREATE_NEW_OAUTH_ACCOUNT: false
      AUTH_MODES: local,oauth-session
    networks:
      - wp1bot-dev
    depends_on:
      zimfarm-db:
        condition: service_healthy
    profiles:
      - zimfarm

  zimfarm-ui:
    image: ghcr.io/openzim/zimfarm-ui:latest
    pull_policy: always
    container_name: zimfarm-ui${WP1_SUFFIX:-}
    ports:
      - 127.0.0.1:${WP1_ZIMFARM_UI_PORT:-8003}:80
    volumes:
      - ./docker/zimfarm/zimfarm_ui_dev/config.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      zimfarm-api:
        condition: service_healthy
    networks:
      - wp1bot-dev
    profiles:
      - zimfarm

  zimfarm-worker-manager:
    image: ghcr.io/openzim/zimfarm-worker-manager:latest
    pull_policy: always
    container_name: zimfarm-worker-manager${WP1_SUFFIX:-}
    depends_on:
      zimfarm-api:
        condition: service_healthy
    command: worker-manager --webapi-uri 'http://zimfarm-api:80/v2' --name test-worker
    environment:
      - DEBUG=true
      - TASK_WORKER_IMAGE=ghcr.io/openzim/zimfarm-task-worker:latest
      - ENVIRONMENT=development
      - ZIMFARM_DISK=20Gb
      - ZIMFARM_MEMORY=20Gb
      - ZIMFARM_CPU=3
      - POLL_INTERVAL=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/zimfarm/id_ed25519:/etc/ssh/keys/zimfarm
    networks:
      - wp1bot-dev
    profiles:
      - zimfarm-worker

networks:
  wp1bot-dev:

volumes:
  minio-data:
  zimfarm-data:
